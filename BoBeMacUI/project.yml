name: BoBe
options:
  bundleIdPrefix: com.bobe
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: false
  groupSortPosition: none

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.7
    traits: []

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      DEBUG_INFORMATION_FORMAT: "dwarf"
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_TESTABILITY: NO

targets:
  PairingClient:
    type: library.static
    platform: macOS
    sources:
      - path: PairingClient
        excludes:
          - PairingClient-Bridging-Header.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobe.pairing-client
        SWIFT_OBJC_BRIDGING_HEADER: PairingClient/PairingClient-Bridging-Header.h
  BoBe:
    type: application
    platform: macOS
    sources:
      - path: BoBe
        excludes:
          - Resources/Info.plist
    resources:
      - path: BoBe/Resources
        excludes:
          - Info.plist
    dependencies:
      - target: PairingClient
      - package: Sparkle
      - package: Textual
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobe.app
        PRODUCT_NAME: BoBe
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        INFOPLIST_FILE: BoBe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: entitlements.plist
        PROVISIONING_PROFILE_SPECIFIER: "$(BOBE_PROVISIONING_PROFILE_SPECIFIER)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/../PairingFFI/target/release"
        OTHER_LDFLAGS: "$(inherited) -lbobe_pairing_ffi -framework Security -framework SystemConfiguration"
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          SWIFTLINT="${PROJECT_DIR}/../.tools/bin/swiftlint"
          if [[ ! -x "$SWIFTLINT" ]]; then
            echo "error: Project SwiftLint is missing. Run: scripts/tasks/bootstrap-tools.sh"
            exit 1
          fi
          "$SWIFTLINT" lint --quiet
  BoBeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BoBeTests
    dependencies:
      - target: BoBe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobe.app.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BoBe.app/Contents/MacOS/BoBe"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  BoBeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BoBeUITests
    dependencies:
      - target: BoBe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobe.app.uitests
        TEST_TARGET_NAME: BoBe
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BoBe:
    build:
      targets:
        BoBe: all
        BoBeTests: [test]
        BoBeUITests: [test]
    test:
      targets:
        - BoBeTests
        - BoBeUITests
