version: "0.2.0"
files:
  exclude: ["**/*"]
  include: ["CMakeLists.txt", "README.md", "idf_component.yml", "*.c", "*.h", "include/**/*.h"]
description: "Authenticated BodyLink WebSocket transport with bounded queues"
dependencies:
  idf: ">=6.0.2,<6.2"
  bobe_platform:
    path: ../bobe_platform
    require: public
  bobe_protocol:
    path: ../bobe_protocol
    require: public
  espressif/esp_websocket_client:
    version: "==1.7.0"
    require: public
