[project]
name = "esp-bobe-toy-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.16"
dependencies = [
    "cryptography>=50.0.2,<51",
    "esptool==5.6.0",
    "protobuf>=7.36.2,<8",
    "pyserial>=3.5,<4",
]

[tool.uv]
package = false
default-groups = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
hil = [
    "numpy==2.5.4",
    "pillow==13.0.0",
    "sounddevice==0.5.6",
    "websockets==17.3",
]

[tool.pyright]
include = ["bobe_hil", "bobe_observer", "tools"]
extraPaths = [
    "managed_components/espressif__network_provisioning/tool/esp_prov",
    "managed_components/espressif__network_provisioning/tool/esp_prov/security",
]
