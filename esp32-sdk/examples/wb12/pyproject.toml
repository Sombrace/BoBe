[project]
name = "esp-bobe-toy-tools"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "cryptography>=50.0.2,<51",
    "esptool==5.4.0",
    "pyserial>=3.5,<4",
]

[tool.uv]
package = false
default-groups = []

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
hil = [
    "numpy==2.4.2",
    "pillow==12.3.0",
    "sounddevice==0.5.5",
    "websockets==16.1.1",
]

[tool.pyright]
include = ["bobe_hil", "bobe_observer", "tools"]
extraPaths = [
    "managed_components/espressif__network_provisioning/tool/esp_prov",
    "managed_components/espressif__network_provisioning/tool/esp_prov/security",
]
