[package]
name = "bobe"
version = "0.9.2"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
authors = ["The BoBe Authors"]
homepage = "https://www.bobebot.com"
repository = "https://github.com/Sombrace/BoBe"
publish = false

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
dead_code_pub_in_binary = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

clone_on_ref_ptr = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "allow"
multiple_unsafe_ops_per_block = "warn"
exit = "warn"


module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
implicit_hasher = "allow"

struct_excessive_bools = "allow"
struct_field_names = "allow"
missing_fields_in_debug = "allow"

unused_async = "allow"
unused_self = "allow"

needless_pass_by_value = "allow"
implicit_clone = "allow"
unnecessary_wraps = "allow"

cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"

return_self_not_must_use = "allow"
similar_names = "allow"
needless_lifetimes = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
incompatible_msrv = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_literal_bound = "allow"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
overflow-checks = true

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
arc-swap = "1.9.2"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
toml_edit = { version = "0.25.17", features = ["serde"] }
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
secrecy = { version = "0.10", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "uuid",
    "chrono",
    "derive",
] }
thiserror = "2.0"
tokio = { version = "1.53.3", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "logging",
    "tls12",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["cors", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
uuid = { version = "1.28", features = ["v4", "serde"] }
url = "2.5.8"
which = "8.0.6"
libc = "0.2.190"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
rand = "0.10.3"
mdns-sd = { version = "0.21", default-features = false }
dashmap = "6.2.1"
tower = { version = "0.5.3", features = ["limit"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "stream",
    "json",
] }
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
flate2 = "1.1.10"
tar = "0.4.46"
zstd = "0.14.2"
bzip2 = "0.6.1"
bytes = "1"
sherpa-onnx = "=1.13.8"
ptts = { version = "=0.4.0-rc.2", default-features = false, features = ["hf"] }
signalsmith-stretch = "=0.1.3"
opusic-c = "1.6.1"
regex = "1.13"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "zeroize"] }
x509-parser = "0.18.1"
bobe-pairing-core = { path = "../PairingCore", version = "=0.9.2" }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
zeroize = "1.9.1"
sha2 = { version = "0.11.1", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
serde_ignored = "0.1.14"
qrcodegen = "1.8.0"

[patch.crates-io]
sherpa-onnx-sys = { path = "../third_party/sherpa-onnx-sys" }
paste = { path = "../third_party/paste" }
