[package]
name = "bobe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["The BoBe Authors"]
homepage = "https://www.bobebot.com"
repository = "https://github.com/athatheo/BoBe"
publish = false

[features]
# `just` runtime recipes externalize the CLI into app/helper staging. Keep this
# default only as a self-contained fallback for direct `cargo build` consumers.
default = ["bundled-copilot-cli"]
bundled-copilot-cli = ["github-copilot-sdk/bundled-cli"]

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"           # Catch silent drops of values with Drop impls
dead_code_pub_in_binary = "warn"       # Public items in this binary must still be used

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# --- Debug leftovers: these should never ship in a daemon ---
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# --- Restriction lints: cherry-picked for safety ---
clone_on_ref_ptr = "warn"              # Arc::clone(&x) over x.clone()
unwrap_used = "warn"                   # No .unwrap() in production
expect_used = "warn"                   # No .expect() in production
undocumented_unsafe_blocks = "warn"    # SAFETY comments required on unsafe
multiple_unsafe_ops_per_block = "warn" # One unsafe op per block, independently justified
exit = "warn"                          # No process::exit() in daemon

# --- Justified allows: architecture-driven (see CLAUDE.md for rationale) ---

# Internal app, not a public crate — naming/docs norms don't apply
module_name_repetitions = "allow" # config::ConfigManager is normal
missing_errors_doc = "allow"      # not a public crate
must_use_candidate = "allow"      # not a library
doc_markdown = "allow"            # internal docs only
implicit_hasher = "allow"         # not a library

# DTOs/config structs match API contracts
struct_excessive_bools = "allow"  # config/settings DTOs have many bool fields
struct_field_names = "allow"      # DTO fields match API contracts
missing_fields_in_debug = "allow" # partial Debug is fine

# Axum framework requirements
unused_async = "allow"            # all instances are Axum handler signatures
unused_self = "allow"             # all instances are trait implementation contracts

# Design patterns — intentional ownership/clone semantics
needless_pass_by_value = "allow"  # ~90% intentional ownership for DI/storage/repos
implicit_clone = "allow"          # all instances intentional — serialization, prompting, API
unnecessary_wraps = "allow"       # Result<Option<T>> is intentional for idempotent repo ops

# Cast safety — all verified safe in context
cast_possible_truncation = "allow" # config→bounds expansions, loop counters bounded by config
cast_sign_loss = "allow"           # expanding types or FFI-required
cast_precision_loss = "allow"      # f64 precision loss acceptable
cast_possible_wrap = "allow"       # FFI requirement (libc expects c_int)
cast_lossless = "allow"            # only 1-2 instances, style-only

# Style preferences
return_self_not_must_use = "allow" # builder patterns
similar_names = "allow"            # id/idx noisy false positives
needless_lifetimes = "allow"       # explicit lifetimes sometimes clearer
items_after_statements = "allow"   # helper closures after use is fine
too_many_lines = "allow"           # some handlers are legitimately long
incompatible_msrv = "allow"        # false positives with deps
trivially_copy_pass_by_ref = "allow" # trait impls and handler signatures
unnecessary_literal_bound = "allow"  # 56 tool trait impls return &str literals — changing trait sig is churn

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
# Defend against integer-overflow bugs that silently wrap in optimized
# builds. The performance cost is unmeasurable for daemon-class workloads
# and the alternative is the class of bug documented in CVE-2018-1000810.
overflow-checks = true

[dependencies]
anyhow = "1.0.103"
async-stream = "0.3.6"
arc-swap = "1.9.2"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
toml_edit = "0.25.13"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.2.1"
secrecy = { version = "0.10", features = ["serde"] }
# SQLite only. TLS and migration-runner features are intentionally omitted:
# schema application uses `raw_sql`; `derive` provides FromRow/Type without
# pulling the query-macro backends for MySQL and PostgreSQL.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "uuid",
    "chrono",
    "derive",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
# `rt` feature exposes `CancellationToken` (the modern shutdown
# coordination primitive that replaces our previous `broadcast::Sender<()>`
# pattern). 0.7.18's feature naming is unusual — there is no `sync`
# feature even though the type lives under `tokio_util::sync::`.
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7.0", features = ["cors", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
which = "8.0.5"
libc = "0.2.186"
base64 = "0.23.1"
rand = "0.10.2"
mdns-sd = { version = "0.20.1", features = ["async"] }
dashmap = "6.2.1"
tower = { version = "0.5.3", features = ["limit"] }
# Streaming HTTP client. Used for two purposes:
#   1. Querying the user's Ollama install on `:11434` for available
#      models (`/api/tags`) when `engine == "local"`.
#   2. Phase 5a: downloading the Ollama runtime tarball with progress
#      streaming (so the wizard can show a live progress bar).
# rustls keeps us off OpenSSL; `stream` lets us consume responses
# incrementally for the download path. (reqwest 0.13 renamed the
# `rustls-tls` feature to plain `rustls`.)
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "stream",
    "json",
] }
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Archive handling for the Ollama install path (Phase 5a). The
# `ollama-darwin.tgz` release tarball ships gzip-compressed.
flate2 = "1.1.9"
tar = "0.4.46"
zstd = "0.13.3"
# bz2 because sherpa-onnx model releases ship as .tar.bz2 not gzip.
bzip2 = "0.6.1"
# Official GitHub Copilot SDK (Rust). Programmatic Copilot CLI control via
# JSON-RPC over stdio. Spawns + manages the CLI process per Client. We use one
# shared Client across the daemon and create one Session per worker class.
#
# SDK 1.0.7 pins and SHA-verifies its matching Copilot CLI asset. BoBe release/debug
# recipes disable `bundled-cli`, stage the SDK-extracted executable, and ship
# it as a separately signed app helper. The root fallback feature still embeds
# it for direct Cargo consumers; clippy/tests skip the download entirely.
github-copilot-sdk = { version = "=1.0.7", default-features = false, features = ["derive"] }
# Stable server-side Kokoro rollback backend. Client STT/VAD and experimental
# Supertonic TTS run in Swift/FluidAudio; sherpa remains until client TTS meets
# the production benchmark and compatibility gates.
sherpa-onnx = "1.13.4"
# Opus codec for the /voice/stream WS — 20ms frames, VOIP profile, ~24kbps.
# Vendors libopus through cmake; needs CMAKE_POLICY_VERSION_MINIMUM=3.5 in env
# to build on toolchains where cmake's minimum-required version is enforced.
# Maintained libopus 1.6.1 bindings. Replaces `opus`/`audiopus_sys`, which is
# unmaintained (RUSTSEC-2026-0150) and no longer builds with CMake 4.
opusic-c = "1.6.1"
# Markdown stripping before Kokoro TTS — Kokoro speaks **asterisks** and
# `backticks` literally otherwise. Used by speech::markdown_strip with
# precompiled LazyLock regex set.
regex = "1.13.1"
# Voice telemetry: LLM TTFT, first-sentence, per-sentence synthesis,
# transcript-to-first-audio, total-turn latency, barge-in and fillers.
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

# macOS-only: Keychain access via the Security framework (Data Protection
# Keychain). Linux uses a file-based `FileSecretStore` fallback.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15"] }
