[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 arrives only through elliptic-curve 0.13 in opaque-ke 4.0.1 and voprf 0.5, the newest stable OPAQUE stack; BoBe's pairing suite uses Ristretto255, whose scalar arithmetic runs in curve25519-dalek, so no secret value reaches crypto-bigint" },
    { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9.0, the newest release, caps libsqlite3-sys below 0.38; sqlx main allows 0.40 for 0.9.1 (launchbadge/sqlx#4525). The daemon opens only SQLite files it wrote, restore never installs -wal or -shm files, and backup verification reads a backup's database read-only, so stale memory from a planted -wal can reach only the integrity report shown to the owner who runs it. Remove when sqlx 0.9.1 is released" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[bans.std-replacements]
scope = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
