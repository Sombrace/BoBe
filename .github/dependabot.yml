version: 2
updates:
  - package-ecosystem: cargo
    directory: /BoBeService
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directories:
      - /PairingCore
      - /PairingFFI
    schedule:
      interval: weekly
      day: monday
    groups:
      pairing:
        group-by: dependency-name
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /BoBeAgent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: swift
    directory: /BoBeMacUI
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
