name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
    paths:
      - "BoBeService/**"
      - "BoBeAgent/**"
      - "BoBeMacUI/**"
      - "BoBeiOS/**"
      - "PairingCore/**"
      - "PairingFFI/**"
      - "third_party/**"
      - "esp32-sdk/components/**"
      - "esp32-sdk/examples/wb12/bobe_hil/bodylink.py"
      - "esp32-sdk/examples/wb12/components/bobe_device_config/**"
      - "esp32-sdk/examples/wb12/tools/create_update_offer.py"
      - "scripts/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev ripgrep fd-find
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            BoBeService
            PairingCore
            PairingFFI
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Agent
        run: scripts/tasks/build-agent.sh
      - name: Pairing crates
        run: |
          for crate in PairingCore PairingFFI; do
            cargo fmt --manifest-path "$crate/Cargo.toml" --check
            cargo test --manifest-path "$crate/Cargo.toml" --locked
          done
      - name: Daemon
        env:
          BOBE_NODE_PATH: ${{ github.workspace }}/build/agent-runtime/node
          BOBE_AGENT_ENTRY: ${{ github.workspace }}/build/agent-runtime/agent/dist/main.js
        run: |
          cargo fmt --manifest-path BoBeService/Cargo.toml --check
          cargo clippy --manifest-path BoBeService/Cargo.toml --locked
          cargo test --manifest-path BoBeService/Cargo.toml --locked
      - name: Dependency policy
        run: |
          for crate in BoBeService PairingCore PairingFFI; do
            (cd "$crate" && cargo deny check --hide-inclusion-graph advisories licenses bans sources)
            cargo machete --with-metadata "$crate"
          done
      - name: Contracts
        run: |
          scripts/check-cross-language-constants.sh
          scripts/check-bodylink-contract.sh
          scripts/check-swift-package-pins.sh
          scripts/check-release-version.sh
          scripts/check-data-paths.sh
          scripts/check-localization-catalogs.sh
          python3 scripts/check-standalone-update-manifest.py
